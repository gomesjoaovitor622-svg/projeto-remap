name: Flutter CI
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/flutter-ci.yml']
permissions:
  contents: read
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instalar dependências
        run: flutter pub get
      - name: Analisar código
        run: flutter analyze
      - name: Executar testes
        run: flutter test
