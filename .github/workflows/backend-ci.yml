name: Backend CI
on:
  push:
    branches: [main]
    paths: ['backend/**', 'docker-compose.yml', '.github/workflows/**']
  pull_request:
    paths: ['backend/**', 'docker-compose.yml', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remap_test
          POSTGRES_USER: remap_test
          POSTGRES_PASSWORD: remap_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U remap_test -d remap_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://remap_test:remap_test_password@localhost:5432/remap_test
      JWT_SECRET_KEY: ci-only-test-secret-key-change-before-production-123456
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Validar migration PostgreSQL
        run: alembic upgrade head
      - name: Executar testes
        run: python -m pytest -q
      - name: Verificar migration atualizada
        run: alembic current
