services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remap}
      POSTGRES_USER: ${POSTGRES_USER:-remap_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - remap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remap_app} -d ${POSTGRES_DB:-remap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - remap_internal

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: REMAP API
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-remap_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-remap}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - remap_internal

volumes:
  remap_postgres_data:

networks:
  remap_internal:
    driver: bridge
